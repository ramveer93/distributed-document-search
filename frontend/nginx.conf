server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Same origin as the API, so there is no CORS anywhere in the system —
  # the browser never learns that the gateway is a separate service.
  # The API is namespaced under /api because /search and /documents/:id are
  # ALSO client-side routes — without the prefix, navigating to /search would
  # be proxied to the gateway and answer 401 instead of loading the app.
  # The trailing slash on proxy_pass strips /api before forwarding.
  location /api/ {
    proxy_pass         http://gateway:8080/;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    # /documents/{id}/raw answers 302 to a presigned URL; the browser must
    # follow it, not nginx
    proxy_redirect     off;
    client_max_body_size 25m;
  }

  # SPA: unknown paths are client-side routes, not 404s
  location / {
    try_files $uri $uri/ /index.html;
  }
}
