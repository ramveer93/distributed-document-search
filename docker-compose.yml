name: deeprunner

x-app: &app
  build: .
  env_file: .env
  restart: unless-stopped

x-app-deps: &app-deps
  postgres:      { condition: service_healthy }
  elasticsearch: { condition: service_healthy }
  redis:         { condition: service_healthy }
  kafka:         { condition: service_healthy }
  minio:         { condition: service_healthy }

services:
  # ------------------------------------------------------------- our code
  gateway:
    <<: *app
    command: gunicorn --chdir /srv/backend gateway.main:app
             -b 0.0.0.0:8080 -w 2 --threads 8 --timeout 60 --preload
             -c /srv/backend/gunicorn_conf.py --access-logfile -
    ports: ["8080:8080"]          # the ONLY exposed application port
    depends_on:
      <<: *app-deps
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    command: gunicorn --chdir /srv/backend main:app
             -b 0.0.0.0:8081 -w 2 --threads 8 --timeout 60 --preload
             -c /srv/backend/gunicorn_conf.py --access-logfile -
    # deliberately NOT published: nothing reaches it except the gateway.
    # even if something did, it verifies the JWT itself.
    expose: ["8081"]
    depends_on:
      <<: *app-deps
      gateway: { condition: service_healthy }   # needs JWKS to verify tokens

  indexer:
    <<: *app
    command: python -m indexer.main
    expose: ["9100"]        # /metrics, internal network only
    depends_on:
      <<: *app-deps

  frontend:
    build: ./frontend
    ports: ["3001:80"]          # the browser talks only to this
    depends_on:
      gateway: { condition: service_healthy }
    restart: unless-stopped

  # ---------------------------------------------------------- datastores
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # KRaft mode: real Kafka, no ZooKeeper, one container
  kafka:
    image: apache/kafka:3.7.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 40

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # console — watch objects land under {tenant}/{doc_id}/raw
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ------------------------------------------------------------ dev tools
  # Not part of the architecture — a window into the one hop with no UI.
  # Connects to the broker on its own schedule; no service ever calls it.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: deeprunner
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
      AUTH_TYPE: DISABLED
      JAVA_OPTS: -Xms128m -Xmx320m
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped
    profiles: ["devtools"]     # docker compose --profile devtools up -d

  # ------------------------------------------------- logs (the second pillar)
  # request_id can never be a Prometheus label — unbounded cardinality would
  # destroy the TSDB. Correlation lives in logs, and Loki puts them in Grafana
  # beside the metrics.
  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./ops/loki/config.yml:/etc/loki/config.yml:ro
      - lokidata:/loki
    ports: ["3100:3100"]
    restart: unless-stopped

  # tails Docker's log output — no application change, the services already
  # write structured JSON to stdout
  alloy:
    image: grafana/alloy:v1.4.2
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.river
    volumes:
      - ./ops/loki/alloy.river:/etc/alloy/config.river:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    restart: unless-stopped

  # -------------------------------------------------------- observability
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes: ["./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes: ["./ops/grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  miniodata:
  lokidata:
