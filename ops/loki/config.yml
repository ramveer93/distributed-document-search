# Single-binary Loki, filesystem storage. Enough for a demo; production would
# use object storage and a real ring.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 24h
  # our lines are JSON with a request id; label cardinality stays low because
  # request_id is parsed at QUERY time, never stored as a label
  max_streams_per_user: 1000
